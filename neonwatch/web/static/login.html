<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeonWatch: sign in</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="login">
<h1 class="brand" data-text="NeonWatch">NeonWatch</h1>
<!--status-->
<form method="post" action="/login">
<p><label for="password">Password</label></p>
<p><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required autofocus></p>
<p><button type="submit">Sign in</button></p>
</form>
</main>
</body>
</html>
