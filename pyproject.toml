[project]
name = "neonwatch"
version = "0.1.0"
description = "A read-only root observer, a NATS JetStream broker, model-judged classification and a local dashboard."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Two runtime dependencies, each owned by one component (tools/gates.py holds that):
#   nats-py -> neonwatch/bus.py      aiohttp -> neonwatch/web/
dependencies = ["nats-py>=2.9,<3", "aiohttp>=3.14.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
neonwatch = "neonwatch.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neonwatch"]
exclude = ["*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["neonwatch", "tools"]
python_files = ["*_test.py"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["neonwatch", "tools"]
omit = ["*_test.py"]

[tool.coverage.report]
show_missing = true
# A ratchet: raise it as components land, never lower it.
fail_under = 95
exclude_lines = ['pragma: no cover', 'if __name__ == .__main__.:', '^\s*\.\.\.$']
