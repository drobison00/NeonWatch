# MSI MEG X570 ACE (ATX, 244 x 305 mm), top down, in mm. An example layout: positions are drawn
# from the board's published layout, not measured. Use it with  [web] board = "<path to this file>".
name = "MSI MEG X570 ACE"
width = 244
height = 305
caption = "MSI MEG X570 ACE, schematic: positions approximate. Which part sits in which slot is read from the PCI topology."
holes = [[6, 6], [6, 299], [238, 6], [238, 299], [130, 6], [130, 299], [238, 150]]
traces = ["M98 92 V112", "M108 92 V112 H150", "M150 80 H158", "M194 228 V258 H232",
          "M168 198 H128", "M168 208 H128", "M40 140 H34"]

# A Ryzen package: the I/O die and two chiplets, each coloured by its own k10temp sensor.
[socket]
x = 74
y = 44
w = 44
h = 44
die = [{ sensor = "Tctl", x = 81, y = 70, w = 14, h = 12 },
       { sensor = "Tccd1", x = 79, y = 50, w = 16, h = 12 },
       { sensor = "Tccd2", x = 97, y = 50, w = 16, h = 12 }]

[[part]]
kind = "io"
x = 0
y = 8
w = 34
h = 150
label = "rear I/O"

